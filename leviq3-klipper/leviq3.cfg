# LeviQ3 for vanilla-klipper on the Anycubic Kobra 3.
# Requires [probe_ks1] and [cs1237] (or mainline [load_cell_probe]/[probe]).
# Copy leviq3.py to klippy/extras/ and include this file from printer.klipper.cfg.

[leviq3]
# Values below are the ones in the stock Kobra 3 printer.cfg
bed_temp: 60
extru_temp: 170
extru_end_temp: 140
z_up: 30
to_z_up_speed: 15
platform_offset_extru: 278,260,0.2
auto_step: 0.0375
zoffset_factor: 0.05
# Stock defaults (not set in the stock printer.cfg)
#return_distance: 0.075
#expansion_factor: 0.0375
#noise_diff: 2500
#max_diff: 5000
# 0 = LEVIQ_AUTO_ZOFFSET only homes Z; change with LEVIQ_AUTO_ZOFFSET_ON_OFF
auto_zoffset_on_off: 0
# Additions of this port
#max_auto_travel: 2.0
#bed_soak_time: 0
# Dirty-nozzle re-wipes of LEVIQ_AUTO_ZOFFSET when RETRY_COUNT is not given.
# 1 = stock behaviour (a nozzle that leaves the bed at once is wiped and
# measured again); 0 = never re-wipe.  RETRY_COUNT=<n> on the command wins.
#retry_count: 1
# Bound to [gcode_macro NOZZLE_WIPE_SEQUENCE] in vanilla-klipper printer.klipper_K3.cfg
wipe_gcode: NOZZLE_WIPE_SEQUENCE
rewipe_gcode: NOZZLE_WIPE_SEQUENCE
# Built into Klipper [bed_mesh]; [exclude_object] is enabled in printer.klipper_K3.cfg
mesh_gcode: BED_MESH_CALIBRATE ADAPTIVE=1
# Keep the mesh LEVIQ_PROBE measured: it is stored in state_file and made the
# active mesh again after a restart.  It never writes the config file; a
# [bed_mesh <profile>] that SAVE_CONFIG wrote is the master.
#mesh_persist: True
#mesh_autoload: True
# True: run SAVE_CONFIG as the last step of LEVIQ_PROBE (writes the mesh
# profile of BED_MESH_CALIBRATE and a pending z_offset; Klipper restarts)
#mesh_save_config: False
# Emulate stock gklib cold retract at extru_end_temp (140C < min_extrude_temp 170C)
#cold_retract: True
# Restore saved/calibrated z_offset at the end of LEVIQ_PROBE (after mesh) and on error
#restore_zoffset: True
# Rinkhals persistent user config dir (/userdata/app/gk/printer_data is bind-mounted from /useremain/home/rinkhals/printer_data)
state_file: /useremain/home/rinkhals/printer_data/config/leviq3_state.json
