name: Öneri / Feature request
description: Yeni özellik veya iyileştirme önerin / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Öneri / Idea
      description: Ne istiyorsunuz ve neden? / What would you like and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Ek bilgi / Additional context
