name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove Wi-Fi names, IP addresses, serial numbers and passwords from logs before attaching them.
        **Do not report security issues here** — see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - USB install package
        - kobra-screen (touchscreen UI)
        - ACE Pro driver
        - LeviQ3 / Z-offset
        - ace-standalone
        - tools/ace-fw
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: LibreCubic3, Kobra 3 firmware, Rinkhals, vanilla-klipper, ACE Pro firmware
      placeholder: "LibreCubic3 0.3.2, firmware 2.4.6.7, Rinkhals 20261101_01, vanilla-klipper 0.3, ACE V1.3.863"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "aGVscF9zb3Nf/open-kobra-install.log from the USB stick, Klipper / Moonraker logs"
      render: text
