# open-kobra sensorless homing korumasi (Anycubic Kobra 3 / vanilla-klipper)
#
# Neden gerekli:
# - printer.klipper_K3.cfg icindeki [stepper_x] ve [stepper_y] TMC2209
#   sensorless homing (virtual_endstop) kullanir ve homing_retract_dist: 0
#   tanimlidir; [tmc2209] bolumlerinde hold_current tanimlidir.
# - G28 X Y (veya tek eksen home) sonunda araba/tabla mekanik sona
#   (X=278.5, Y=-6) dayali kalir; ayni ya da sonraki G28 cagrisinda
#   ivmelenme mesafesi olmadigi icin StallGuard4 duraklamayi zamaninda
#   algilayamaz ve motor ~2 mm daha iterek kayis/dis atlatir.
# - Ayrica zaten home edilmis eksenlerde (ornegin Home -> Z-offset olcumu
#   oncesi G28) eksen konumu bilindigi halde XY yeniden mekanik sona surulur.
#
# Not: printer.klipper.cfg [safe_z_home] icerdigi icin Klipper [homing_override]
# ile birlikte yuklenemez ("homing_override and safe_z_home cannot be used
# simultaneously"). Bu nedenle G28 guvenli bicimde [gcode_macro G28]
# (rename_existing: G28.1) uzerinden sarmalanir ve [safe_z_home] ile
# [probe_ks1] Z-home akisi tamamen korunur.
#
# Akim notu: home_current_x/y=0.0 iken fabrika driver_SGTHRS (72/62)
# kalibrasyonuyla uyumlu olan run_current (1.5A/1.7A) korunur ve yalnizca
# hold_current dususu gecici kapatilir (HOLDCURRENT=hcur). Soguk G28'de Y
# hala sert vuruyorsa home_current_y (orn. 1.2) ile birlikte SGTHRS yeniden
# ayarlanmalidir.

[stepper_x]
homing_retract_dist: 0

[tmc2209 stepper_x]
# Stock Kobra 3 value. vanilla-klipper sets False, which drives X with plain
# 16 microsteps and makes the head whine during moves.
interpolate: True

[stepper_y]
homing_retract_dist: 0
# Stock Kobra 3 printer.cfg value. vanilla-klipper ships 277, which lets a
# manual jog run Y into the frame (belt skips around 262-265).
position_max: 260

[gcode_macro G28]
rename_existing: G28.1
description: "Safe sensorless home: skips already-homed XY (Z always homed), back-off before/after and TMC/stall protection"
variable_backoff_mm: 10.0
variable_travel_speed: 100.0
variable_stall_clear_ms: 2000
variable_skip_homed_xy: True
variable_skip_homed_z: False
variable_home_current_x: 0.0
variable_home_current_y: 0.0
variable_tmc_override_active: False
gcode:
    {% set req_x = params.X is defined %}
    {% set req_y = params.Y is defined %}
    {% set req_z = params.Z is defined %}
    {% set req_any = req_x or req_y or req_z %}
    {% set force = (params.FORCE is defined) and ((params.FORCE|string|replace('=', '')|int(1)) != 0) %}

    {% set homed = printer.toolhead.homed_axes|default('')|lower %}
    {% set pos = printer.toolhead.position|default([0.0, 0.0, 0.0, 0.0]) %}
    {% set x_homed = 'x' in homed %}
    {% set y_homed = 'y' in homed %}
    {% set z_homed = 'z' in homed %}

    {% if req_any %}
        {% set do_x = req_x %}
        {% set do_y = req_y %}
        {% set do_z = req_z %}
    {% elif force %}
        {% set do_x = True %}
        {% set do_y = True %}
        {% set do_z = True %}
    {% else %}
        {% set do_x = (not x_homed) if skip_homed_xy else True %}
        {% set do_y = (not y_homed) if skip_homed_xy else True %}
        {% set do_z = (not z_homed) if skip_homed_z else True %}
    {% endif %}

    {% set sx = printer.configfile.settings.get('stepper_x', {}) %}
    {% set sy = printer.configfile.settings.get('stepper_y', {}) %}
    {% set sz = printer.configfile.settings.get('stepper_z', {}) %}

    {% set x_end = sx.get('position_endstop', 278.5)|float %}
    {% set x_min = sx.get('position_min', -19.5)|float %}
    {% set x_max = sx.get('position_max', 278.5)|float %}
    {% set x_pos_dir = x_end > ((x_min + x_max) / 2.0) %}
    {% set x_safe = ([x_min, x_end - backoff_mm]|max) if x_pos_dir else ([x_max, x_end + backoff_mm]|min) %}

    {% set y_end = sy.get('position_endstop', -6.0)|float %}
    {% set y_min = sy.get('position_min', -6.0)|float %}
    {% set y_max = sy.get('position_max', 277.0)|float %}
    {% set y_pos_dir = y_end > ((y_min + y_max) / 2.0) %}
    {% set y_safe = ([y_min, y_end - backoff_mm]|max) if y_pos_dir else ([y_max, y_end + backoff_mm]|min) %}

    {% set has_safe_z = 'safe_z_home' in printer.configfile.settings %}
    {% set szh = printer.configfile.settings.get('safe_z_home', {}) %}
    {% set safe_xy = szh.get('home_xy_position', [127.0, 127.0]) %}
    {% set safe_x = safe_xy[0]|float %}
    {% set safe_y = safe_xy[1]|float %}
    {% set safe_f = (szh.get('speed', 50.0)|float) * 60.0 %}
    {% set z_hop = [szh.get('z_hop', 0.0)|float, sz.get('position_max', 262.0)|float]|min %}
    {% set z_hop_speed = szh.get('z_hop_speed', 15.0)|float %}
    {% set z_hop_f = z_hop_speed * 60.0 %}
    {% set travel_f = (travel_speed|float) * 60.0 %}
    {% set fm = printer.configfile.settings.get('force_move', {}) %}
    {% set can_force_z = fm.get('enable_force_move', False) %}

    {% set has_tmc_x = 'tmc2209 stepper_x' in printer.configfile.settings %}
    {% set has_tmc_y = 'tmc2209 stepper_y' in printer.configfile.settings %}
    {% set tmc_x = printer.configfile.settings.get('tmc2209 stepper_x', {}) %}
    {% set tmc_y = printer.configfile.settings.get('tmc2209 stepper_y', {}) %}
    {% set run_x = tmc_x.get('run_current', 1.5)|float %}
    {% set run_y = tmc_y.get('run_current', 1.7)|float %}
    {% set hold_x = [tmc_x.get('hold_current', run_x)|float, run_x]|min %}
    {% set hold_y = [tmc_y.get('hold_current', run_y)|float, run_y]|min %}
    {% set hcur_x = (home_current_x|float) if (home_current_x|float) > 0.0 else run_x %}
    {% set hcur_y = (home_current_y|float) if (home_current_y|float) > 0.0 else run_y %}

    {% if (not do_x) and (not do_y) and (not do_z) %}
        {% if has_safe_z %}
            SAVE_GCODE_STATE NAME=_ok_home_idle
            G91
            {% if z_homed and z_hop > 0.0 and pos[2] < z_hop %}
                G1 Z{ '%.3f' % (z_hop - pos[2]) } F{ '%.1f' % z_hop_f }
            {% endif %}
            {% set dx = safe_x - pos[0] %}
            {% set dy = safe_y - pos[1] %}
            {% if (dx|abs) > 0.05 or (dy|abs) > 0.05 %}
                G1 X{ '%.3f' % dx } Y{ '%.3f' % dy } F{ '%.1f' % safe_f }
            {% endif %}
            M400
            RESTORE_GCODE_STATE NAME=_ok_home_idle MOVE=0
        {% endif %}
    {% else %}
        {% set need_pre_x = do_x and x_homed and ((x_pos_dir and pos[0] > (x_safe + 0.1)) or ((not x_pos_dir) and pos[0] < (x_safe - 0.1))) %}
        {% set need_pre_y = do_y and y_homed and ((y_pos_dir and pos[1] > (y_safe + 0.1)) or ((not y_pos_dir) and pos[1] < (y_safe - 0.1))) %}
        {% set can_pre_xy = z_homed or (can_force_z and z_hop > 0.0) or (z_hop <= 0.0) %}

        {% if (need_pre_x or need_pre_y) and can_pre_xy %}
            SAVE_GCODE_STATE NAME=_ok_home_pre
            G91
            {% if z_homed and z_hop > 0.0 and pos[2] < z_hop %}
                G1 Z{ '%.3f' % (z_hop - pos[2]) } F{ '%.1f' % z_hop_f }
            {% elif (not z_homed) and can_force_z and z_hop > 0.0 and pos[2] < z_hop %}
                FORCE_MOVE STEPPER=stepper_z DISTANCE=5.0 VELOCITY={ '%.1f' % z_hop_speed } ACCEL=300.0
            {% endif %}
            G1{% if need_pre_x %} X{ '%.3f' % (x_safe - pos[0]) }{% endif %}{% if need_pre_y %} Y{ '%.3f' % (y_safe - pos[1]) }{% endif %} F{ '%.1f' % travel_f }
            M400
            RESTORE_GCODE_STATE NAME=_ok_home_pre MOVE=0
        {% endif %}

        {% if do_x or do_y %}
            {% if do_x %}
                SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
            {% endif %}
            {% if do_y %}
                SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
            {% endif %}
            M400
            SET_GCODE_VARIABLE MACRO=G28 VARIABLE=tmc_override_active VALUE=True
            {% if do_x and has_tmc_x %}
                SET_TMC_CURRENT STEPPER=stepper_x CURRENT={ '%.3f' % hcur_x } HOLDCURRENT={ '%.3f' % hcur_x }
            {% endif %}
            {% if do_y and has_tmc_y %}
                SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ '%.3f' % hcur_y } HOLDCURRENT={ '%.3f' % hcur_y }
            {% endif %}
            G4 P{ stall_clear_ms|int }
            M400
        {% endif %}

        {% if do_x and do_y and do_z %}
            G28.1
        {% else %}
            G28.1{% if do_x %} X{% endif %}{% if do_y %} Y{% endif %}{% if do_z %} Z{% endif %}
        {% endif %}

        {% if (do_x or do_y) and not (do_z and has_safe_z) %}
            SAVE_GCODE_STATE NAME=_ok_home_post
            G91
            G1{% if do_x %} X{ '%.3f' % (x_safe - x_end) }{% endif %}{% if do_y %} Y{ '%.3f' % (y_safe - y_end) }{% endif %} F{ '%.1f' % travel_f }
            M400
            RESTORE_GCODE_STATE NAME=_ok_home_post MOVE=0
        {% endif %}
    {% endif %}

    {% if do_x or do_y or tmc_override_active %}
        {% if has_tmc_x %}
            SET_TMC_CURRENT STEPPER=stepper_x CURRENT={ '%.3f' % run_x } HOLDCURRENT={ '%.3f' % hold_x }
        {% endif %}
        {% if has_tmc_y %}
            SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ '%.3f' % run_y } HOLDCURRENT={ '%.3f' % hold_y }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=G28 VARIABLE=tmc_override_active VALUE=False
    {% endif %}

[gcode_macro FORCE_HOME]
description: "Safely re-home all axes (X, Y, Z) even if they are already homed"
gcode:
    G28 FORCE=1

# ---------------------------------------------------------------------------
# Nozzle wipe, park/purge/cut, print lifecycle and ACE preparation overrides
# (overrides vanilla-klipper printer.klipper.cfg / printer_generic_macros.cfg
#  / ace_macros_generic.cfg)
#
# Physical order: park -> heat -> retract -> wipe/cut -> cool -> work -> park.
# Z is never lowered toward a part (always max(current_z, safe_z), clamped to
# axis_maximum.z), and unhomed axes are never moved (G28 first where safe, or
# moves skipped on PRINT_END / CANCEL_PRINT over a finished/partial print).
# ---------------------------------------------------------------------------

[gcode_macro MOVE_HEAT_POS]
description: "Safe heating park: G28 if needed, Z at least 15 mm (never lowered), X278 over the purge chute"
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      G28
    {% endif %}
    _OK_MOVE_HEAT_POS_EXEC

[gcode_macro _OK_MOVE_HEAT_POS_EXEC]
description: "Internal helper for MOVE_HEAT_POS (evaluates Z after any G28)"
gcode:
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set z_target = [[cur_z, 15.0]|max, z_limit]|min %}
    SAVE_GCODE_STATE NAME=_ok_move_heat_pos
    G90
    {% if cur_z < z_target - 0.01 %}
      G1 Z{'%.3f' % z_target} F4800
      M400
    {% endif %}
    G1 X278 F9600
    M400
    RESTORE_GCODE_STATE NAME=_ok_move_heat_pos MOVE=0

[gcode_macro MOVE_FLUSH_POS]
description: "Purge chute sweep position: X278 -> X271.5 controlled sweep"
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=_ok_move_flush_pos
    G90
    G1 X278 F9600
    G1 X271.5 F1200
    M400
    RESTORE_GCODE_STATE NAME=_ok_move_flush_pos MOVE=0

[gcode_macro TO_THROW_POSITION]
description: "Throw purge and align with the chute: X250 -> X278 -> X271.5"
gcode:
    {% set has_speed = 1 if (params.SPEED is defined) else 0 %}
    {% set speed_arg = params.SPEED|default(1200)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      G28
    {% endif %}
    _OK_TO_THROW_EXEC HAS_SPEED={has_speed} SPEED={speed_arg}

[gcode_macro _OK_TO_THROW_EXEC]
description: "Internal helper for TO_THROW_POSITION (evaluates X after any G28)"
gcode:
    {% set has_speed = params.HAS_SPEED|default(0)|int %}
    {% set cur_x = printer.toolhead.position.x|default(0.0)|float %}
    {% set speed = params.SPEED|float if has_speed else (1200.0 if cur_x >= 255.0 else 9600.0) %}
    SAVE_GCODE_STATE NAME=_ok_to_throw
    G90
    G1 X250 F{'%.1f' % speed}
    M400
    RESTORE_GCODE_STATE NAME=_ok_to_throw MOVE=0
    MOVE_FLUSH_POS

[gcode_macro FLUSH_POOP]
description: "Cool and throw the purge: M106 S255 (3 s), X250 F1200, X278 -> X271.5 sweep"
variable_cool_ms: 3000
variable_throw_speed: 1200
gcode:
    {% set cfg = printer["gcode_macro FLUSH_POOP"] %}
    {% set cool_ms = params.COOL_MS|default(cfg.cool_ms)|int %}
    {% set throw_speed = params.SPEED|default(cfg.throw_speed)|float %}
    {% set saved_fan_pwm = (((printer.fan.speed|default(0.0)|float) * 255.0)|round|int) if 'fan' in printer else 0 %}
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=_ok_flush_poop
    M106 S255
    G4 P{cool_ms}
    G90
    G1 X250 F{'%.1f' % throw_speed}
    M400
    G1 X278 F9600
    G1 X271.5 F1200
    M400
    M106 S{saved_fan_pwm}
    RESTORE_GCODE_STATE NAME=_ok_flush_poop MOVE=0

[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
description: "Controlled chute sweep before resuming"
gcode:
    TO_THROW_POSITION SPEED=1200
    TO_THROW_POSITION SPEED=2000

[gcode_macro CUT_TIP]
description: "Safe filament cut: homed check, Z never lowered, X current 1.8A/1.1A then restored"
variable_cut_x: -15.0
variable_cut_current: 1.8
variable_cut_hold_current: 1.1
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      { action_respond_info("ACE[M]: Axes not homed - homing before cut") }
      G28
    {% endif %}
    _OK_CUT_TIP_EXEC

[gcode_macro _OK_CUT_TIP_EXEC]
description: "Internal helper for CUT_TIP (evaluates Z/temp after any G28)"
gcode:
    {% set cfg = printer["gcode_macro CUT_TIP"] %}
    {% set cut_x = cfg.cut_x|default(-15.0)|float %}
    {% set cut_cur = cfg.cut_current|default(1.8)|float %}
    {% set cut_hold = cfg.cut_hold_current|default(1.1)|float %}
    {% set has_tmc_x = 'tmc2209 stepper_x' in printer.configfile.settings %}
    {% set tmc_x = printer.configfile.settings.get('tmc2209 stepper_x', {}) %}
    {% set run_x = tmc_x.get('run_current', 1.5)|float %}
    {% set hold_x = [tmc_x.get('hold_current', run_x)|float, run_x]|min %}
    {% set can_force = printer.configfile.settings.get('force_move', {}).get('enable_force_move', False) %}
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set safe_z = [[cur_z, 15.0]|max, z_limit]|min %}

    { action_respond_info("ACE[M]: Cut pre...") }
    SAVE_GCODE_STATE NAME=_ok_cut_tip
    {% if printer.extruder.can_extrude %}
      M83
      G1 E-2 F300
      M82
      M400
    {% endif %}

    { action_respond_info("ACE[M]: Cutting...") }
    G90
    {% if cur_z < safe_z - 0.01 %}
      G1 Z{'%.3f' % safe_z} F4800
      M400
    {% endif %}
    G1 X0 F12000
    M400
    {% if has_tmc_x %}
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={'%.3f' % cut_cur} HOLDCURRENT={'%.3f' % cut_hold}
      G4 P100
    {% endif %}
    G1 X{'%.1f' % cut_x} F600
    M400
    {% if can_force %}
      FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
      FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10
      FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
    {% endif %}
    G1 X0 F6000
    M400
    {% if has_tmc_x %}
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={'%.3f' % run_x} HOLDCURRENT={'%.3f' % hold_x}
      G4 P100
    {% endif %}
    MOVE_FLUSH_POS
    M400
    {% if can_force %}
      FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10
      M400
    {% endif %}
    RESTORE_GCODE_STATE NAME=_ok_cut_tip MOVE=0
    { action_respond_info("ACE[M]: Cut done...") }

[gcode_macro _ACE_PREPARE_FOR_RETRACTION]
description: "ACE retraction prep: park first (X278, Z>=15), heat if needed, retract and CUT_TIP"
gcode:
    {% set target_temp      = params.TARGET_TEMP|default(0)|int %}
    {% set pre_cut_retract  = params.PRE_CUT_RETRACT|default(2)|float %}
    {% set current_temp     = printer.extruder.temperature|float %}
    {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|int %}

    _OK_PARK_PURGE

    {% if current_temp < min_extrude_temp %}
      {% set heat_temp = target_temp if target_temp >= min_extrude_temp else (min_extrude_temp + 10) %}
      { action_respond_info("ACE: PREPARE_RETRACT - heating to %d°C" % heat_temp) }
      M109 S{heat_temp}
    {% else %}
      { action_respond_info("ACE: PREPARE_RETRACT - already hot enough (%.1f°C)" % current_temp) }
    {% endif %}

    {% if pre_cut_retract > 0 %}
      { action_respond_info("ACE: PREPARE_RETRACT - pre-cut retract %.1fmm" % pre_cut_retract) }
      _OK_RETRACT_IF_HOT LENGTH={pre_cut_retract} SPEED=600
    {% endif %}

    {% if printer["gcode_macro CUT_TIP"] is defined %}
      { action_respond_info("ACE: PREPARE_RETRACT - cutting tip") }
      CUT_TIP
    {% else %}
      { action_respond_info("ACE: CUT_TIP macro not available") }
    {% endif %}

[gcode_macro MOVE_END_POS]
description: "End/cancel presentation position (only if XY is homed)"
gcode:
    {% set homed = printer.toolhead.homed_axes|default('')|lower %}
    {% if 'x' in homed and 'y' in homed %}
      SAVE_GCODE_STATE NAME=_ok_move_end_pos
      G90
      G1 X5 Y242.25 F9600
      M400
      RESTORE_GCODE_STATE NAME=_ok_move_end_pos MOVE=0
    {% endif %}

[gcode_macro NOZZLE_WIPE_SEQUENCE]
description: "Silicone pad nozzle wipe: M106 S255 (fan restored on exit), avoids probing with a hot dirty nozzle"
# By default (use_probe=0), scrubs at homed Z + wipe_z over the rear silicone
# wiper (X50-86, Y259-260) without pressing a hot/dirty nozzle onto the PEI
# plate. Set use_probe=1 (or PROBE=1) to probe at probe_x/probe_y only when
# the nozzle is below max_probe_temp (or FORCE_PROBE=1).
variable_probe_x: 15
variable_probe_y: 240
variable_scrub_offset: 0.35
variable_wipe_z: 0.5
variable_use_probe: 0
variable_max_probe_temp: 150.0
variable_z_contact: 0.0
variable_z_contact_valid: 0
gcode:
    {% set cfg = printer["gcode_macro NOZZLE_WIPE_SEQUENCE"] %}
    {% set use_probe = params.PROBE|default(cfg.use_probe)|int %}
    {% set force_probe = params.FORCE_PROBE|default(0)|int %}
    {% set cur_temp = printer.extruder.temperature|default(0.0)|float %}
    {% set max_probe_temp = cfg.max_probe_temp|default(150.0)|float %}
    {% set mesh = printer.bed_mesh.profile_name if 'bed_mesh' in printer else '' %}
    {% set saved_fan_pwm = (((printer.fan.speed|default(0.0)|float) * 255.0)|round|int) if 'fan' in printer else 0 %}
    {% if "xyz" not in printer.toolhead.homed_axes|default('')|lower %}
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=wipe_nozzle_state
    {% if 'bed_mesh' in printer %}
      BED_MESH_CLEAR
    {% endif %}
    {% if 'gcode_macro VEL_PUSH' in printer %}
      VEL_PUSH
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL=15000 ACCEL_TO_DECEL=5000 VELOCITY=300
    {% if use_probe != 0 %}
      {% if force_probe != 0 or cur_temp < max_probe_temp %}
        _OK_WIPE_PROBE
      {% else %}
        RESPOND TYPE=echo MSG="Wipe: nozzle hot, skipping bed PROBE and using safe wiper height"
      {% endif %}
    {% endif %}
    M106 S255
    _OK_WIPE_SCRUB USE_PROBE={use_probe}
    M106 S{saved_fan_pwm}
    {% if 'gcode_macro VEL_POP' in printer %}
      VEL_POP
    {% endif %}
    G90
    {% if mesh %}
      BED_MESH_PROFILE LOAD={mesh}
    {% endif %}
    RESTORE_GCODE_STATE NAME=wipe_nozzle_state MOVE=1 MOVE_SPEED=200

[gcode_macro _OK_WIPE_PROBE]
description: "Internal helper: probe bed contact height for NOZZLE_WIPE_SEQUENCE at safe travel Z"
gcode:
    {% set cfg = printer["gcode_macro NOZZLE_WIPE_SEQUENCE"] %}
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set safe_z = [[cur_z, 5.0]|max, z_limit]|min %}
    G90
    {% if cur_z < safe_z - 0.01 %}
      G1 Z{'%.3f' % safe_z} F600
    {% endif %}
    G1 X{cfg.probe_x} Y{cfg.probe_y} F9600
    PROBE
    _OK_STORE_PROBE VAR=z_contact

[gcode_macro _OK_STORE_PROBE]
description: "Store the last PROBE contact height in a NOZZLE_WIPE_SEQUENCE variable (evaluated after PROBE)"
gcode:
    SET_GCODE_VARIABLE MACRO=NOZZLE_WIPE_SEQUENCE VARIABLE={params.VAR} VALUE={'%.4f' % printer.probe.last_z_result|float}
    SET_GCODE_VARIABLE MACRO=NOZZLE_WIPE_SEQUENCE VARIABLE=z_contact_valid VALUE=1

[gcode_macro _OK_WIPE_SCRUB]
description: "Scrub the nozzle over the rear silicone wiper at safe homed/probed height"
gcode:
    {% set cfg = printer["gcode_macro NOZZLE_WIPE_SEQUENCE"] %}
    {% set use_probe = params.USE_PROBE|default(cfg.use_probe)|int %}
    {% set contact = cfg.z_contact|float %}
    {% set contact_valid = cfg.z_contact_valid|default(0)|int %}
    {% set origin_z = printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - origin_z %}
    {% set safe_z = [[cur_z, 5.0]|max, z_limit]|min %}
    {% if use_probe != 0 and contact_valid != 0 and contact > -3.0 and contact < 3.0 %}
      {% set z_raw = contact + cfg.scrub_offset|float - origin_z %}
    {% else %}
      {% set z_raw = cfg.wipe_z|default(0.5)|float - origin_z %}
    {% endif %}
    {% set z_scrub = [[z_raw, -0.5]|max, 3.0]|min %}
    G90
    {% if cur_z < safe_z - 0.01 %}
      G1 Z{'%.3f' % safe_z} F600
    {% endif %}
    G1 X50 Y260 F9600
    M400
    G1 Z{'%.3f' % z_scrub} F600
    {% for i in range(3) %}
      G1 X86 Y260 F6000
      G1 X86 Y259 F6000
      G1 X50 Y259 F6000
      G1 X50 Y260 F6000
    {% endfor %}
    G1 Z{'%.3f' % safe_z} F600
    M400

[gcode_macro UNDERLINE]
# Half of the vanilla-klipper purge line (X10-95 instead of X10-180).
# G9111 retracts 3 mm before leaving the chute; the line starts by pushing it back.
gcode:
    SAVE_GCODE_STATE NAME=_ok_underline
    G90
    M82
    G92 E0
    G1 Y4 F2400
    G1 X10 F9600
    G1 Z0.28
    G1 E3 F300
    G1 X95 E20 F500
    M400
    G92 E0
    G1 E-0.5 F300
    G1 Z2
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ok_underline MOVE=0

[gcode_macro G9111]
description: "Startup: G9111 BEDTEMP=<°C> EXTRUDERTEMP=<°C> [WIPETEMP=<°C>] [TOOL=inital tool index]"
variable_travel_speed: 200
variable_wipe_temp: 170
variable_probe_temp: 140
variable_purge_retract: 5
variable_prime_length: 25
variable_bed_mesh: 1
variable_home_z: 1
gcode:
  {% set bed_raw = (params.BEDTEMP | default(params.S) | default("60")) | string %}
  {% set noz_raw = (params.EXTRUDERTEMP | default(params.T) | default("200")) | string %}
  {% set wipe_raw = (params.WIPETEMP | default(printer["gcode_macro G9111"].wipe_temp) | string) %}
  # T is the nozzle temperature here (G9111 S.. T..); the tool only comes from TOOL=
  {% set TOOL = ((params.TOOL | default(params.tool) | default("-1")) | string | replace('=', '', 1) | int) %}
  {% set BEDTEMP = (bed_raw | replace('=', '', 1)) | float %}
  {% set EXTRUDERTEMP = (noz_raw | replace('=', '', 1)) | float %}
  {% set WIPETEMP = (wipe_raw | replace('=', '', 1)) | float %}
  {% set cfg = printer["gcode_macro G9111"] %}
  {% set PROBETEMP = cfg.probe_temp | float %}
  {% set RETRACT = cfg.purge_retract | float %}
  {% set PRIME = (params.PRIME | default(cfg.prime_length) | string | replace('=', '', 1)) | float %}
  {% set DO_MESH = cfg.bed_mesh | int %}
  {% set DO_HOME_Z = cfg.home_z | int %}
  {% set has_leviq3 = 'leviq3' in printer.configfile.settings %}
  {% set saved_mesh = printer.bed_mesh.profile_name if 'bed_mesh' in printer else '' %}
  {% set ace_on = (printer["output_pin ACE_Pro"] is defined) and (printer["output_pin ACE_Pro"].value|int != 0) %}
  {% set homed_at_start = printer.toolhead.homed_axes|default('')|lower %}

  UPDATE_DELAYED_GCODE ID=ok_cooldown_fan_off DURATION=0
  # One-shot screen options: reset now so an aborted start cannot leak them into the next print
  SET_GCODE_VARIABLE MACRO=G9111 VARIABLE=bed_mesh VALUE=1
  SET_GCODE_VARIABLE MACRO=G9111 VARIABLE=home_z VALUE=1

  { action_respond_info(
      "G9111: bed=%.1f°C, wipe=%.1f°C, final nozzle=%.1f°C, tool=%d, mesh=%d, home_z=%d, leviq3=%d"
      % (BEDTEMP, WIPETEMP, EXTRUDERTEMP, TOOL, DO_MESH, DO_HOME_Z, 1 if has_leviq3 else 0)
    ) }

  {% if 'pause_resume' in printer.configfile.settings %}
    CLEAR_PAUSE
  {% endif %}
  {% if 'gcode_macro logo_light_on' in printer %}
    logo_light_on
  {% endif %}
  RESPOND TYPE=echo MSG="Pre-heat for nozzle wipe"
  M104 S{WIPETEMP}
  M140 S{BEDTEMP}

  RESPOND TYPE=echo MSG="Home"
  {% if not DO_HOME_Z and 'x' in homed_at_start and 'y' in homed_at_start and 'z' in homed_at_start %}
    # Z measurement switched off: keep the existing Z, do not re-home it with the dirty nozzle
    G28 X Y
  {% else %}
    G28
  {% endif %}

  RESPOND TYPE=echo MSG="Wait for wipe temperature over the purge chute"
  MOVE_HEAT_POS
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={WIPETEMP - 2}
  _OK_RETRACT_IF_HOT LENGTH={RETRACT}
  RESPOND TYPE=echo MSG="Wipe nozzle"
  NOZZLE_WIPE_SEQUENCE

  RESPOND TYPE=echo MSG="Cool nozzle for probing"
  M106 S255
  M104 S{PROBETEMP}
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PROBETEMP + 2}
  M106 S0

  {% if BEDTEMP > 0 %}
    RESPOND TYPE=echo MSG="Wait for bed temperature before probing"
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BEDTEMP - 2}
  {% endif %}

  {% if DO_HOME_Z %}
    {% if 'bed_mesh' in printer %}
      BED_MESH_CLEAR
    {% endif %}
    {% if has_leviq3 %}
      RESPOND TYPE=echo MSG="Clean nozzle Z-home / Auto Z-offset (LeviQ3)"
      LEVIQ_AUTO_ZOFFSET
    {% else %}
      RESPOND TYPE=echo MSG="Home Z with the clean nozzle"
      G90
      G28 Z
    {% endif %}
  {% endif %}

  {% if DO_MESH %}
    RESPOND TYPE=echo MSG="(Adaptive) bed mesh"
    BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
  {% else %}
    RESPOND TYPE=echo MSG="Bed mesh skipped, using the saved mesh"
    {% if saved_mesh and DO_HOME_Z %}
      BED_MESH_PROFILE LOAD={saved_mesh}
    {% elif saved_mesh == "" and 'bed_mesh' in printer and "default" in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD=default
    {% endif %}
  {% endif %}

  {% if 'gcode_macro nozzle_light_on' in printer %}
    nozzle_light_on
  {% endif %}
  RESPOND TYPE=echo MSG="Heat nozzle to print temperature over the purge chute"
  M106 S0
  MOVE_HEAT_POS
  M104 S{EXTRUDERTEMP}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDERTEMP - 2}

  {% if has_leviq3 %}
    RESPOND TYPE=echo MSG="Apply LeviQ3 nozzle thermal Z-offset"
    LEVIQ_TEMP_OFFSET TEMP={EXTRUDERTEMP}
  {% endif %}

  {% if printer["gcode_macro _ACE_STATE"] is defined
   and printer["gcode_macro _ACE_STATE"].startup_toolchange is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=1
  {% endif %}

  {% if ace_on or ('gcode_macro T0' in printer) %}
    {% if TOOL >= 0 %}
      RESPOND TYPE=echo MSG="Selecting passed active tool"
      T{TOOL}
    {% else %}
      {% set current_extruder = printer.toolhead.extruder %}
      {% set suffix = current_extruder | replace('extruder','') %}
      {% set tool_num = suffix if suffix|length > 0 else '0' %}
      RESPOND TYPE=echo MSG="Re-selecting active tool"
      T{tool_num}
    {% endif %}
  {% endif %}

  _OK_START_POST_PRIME PRIME={PRIME}

  RESPOND TYPE=echo MSG="Purge line"
  UNDERLINE

  SET_GCODE_VARIABLE MACRO=G9111 VARIABLE=bed_mesh VALUE=1
  SET_GCODE_VARIABLE MACRO=G9111 VARIABLE=home_z VALUE=1
  RESPOND TYPE=echo MSG="G9111 complete."

[gcode_macro _OK_START_POST_PRIME]
description: "Internal helper for G9111: conditional prime + FLUSH_POOP only if ACE did not already purge"
gcode:
  {% set prime_len = params.PRIME|default(25)|float %}
  {% set ace_on = (printer["output_pin ACE_Pro"] is defined) and (printer["output_pin ACE_Pro"].value|int != 0) %}
  {% set has_ace_state = printer["gcode_macro _ACE_STATE"] is defined and printer["gcode_macro _ACE_STATE"].startup_toolchange is defined %}
  {% set startup_flag = printer["gcode_macro _ACE_STATE"].startup_toolchange|int if has_ace_state else 0 %}
  {% set ace_already_purged = ace_on and has_ace_state and (startup_flag == 0) %}

  {% if has_ace_state and startup_flag != 0 %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=0
  {% endif %}

  {% if (not ace_already_purged) and prime_len > 0 %}
    RESPOND TYPE=echo MSG="Prime nozzle over the purge chute"
    MOVE_HEAT_POS
    SAVE_GCODE_STATE NAME=_ok_g9111_prime
    M83
    G92 E0
    G1 E{'%.1f' % prime_len} F300
    G1 E-3 F1800
    G92 E0
    M400
    RESTORE_GCODE_STATE NAME=_ok_g9111_prime MOVE=0
    FLUSH_POOP
  {% else %}
    RESPOND TYPE=echo MSG="ACE already purged at startup; skipping duplicate prime"
    _OK_RETRACT_IF_HOT LENGTH=3
  {% endif %}

[gcode_macro _OK_RETRACT_IF_HOT]
description: "Retract LENGTH mm if the nozzle is hot enough to extrude (evaluated when called)"
gcode:
  {% set length = params.LENGTH|default(5)|float %}
  {% set speed = params.SPEED|default(1800)|float %}
  {% if printer.extruder.can_extrude and length > 0 %}
    SAVE_GCODE_STATE NAME=_ok_retract_if_hot
    M83
    G1 E-{'%.2f' % length} F{'%.1f' % speed}
    M400
    RESTORE_GCODE_STATE NAME=_ok_retract_if_hot MOVE=0
  {% else %}
    RESPOND TYPE=echo MSG="Nozzle below min_extrude_temp, retract skipped"
  {% endif %}

[gcode_macro _OK_PARK_PURGE]
description: "Home only if needed, lift to at least Z15 and park over the purge chute (X278); RETRACT=<mm> pulls filament back if hot"
gcode:
  {% set retract = params.RETRACT|default(0)|float %}
  MOVE_HEAT_POS
  {% if retract > 0 %}
    _OK_RETRACT_IF_HOT LENGTH={retract}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: "Load filament: safe park, heat if needed, push 150 mm, FLUSH_POOP, heater off when idle"
gcode:
  {% set min_ext = printer.configfile.settings.extruder.min_extrude_temp|default(170)|int %}
  {% set cur_temp = printer.extruder.temperature|float %}
  {% set prev_target = printer.extruder.target|int %}
  {% set ps = printer.print_stats.state|default('standby')|string %}

  SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
  MOVE_HEAT_POS
  TO_THROW_POSITION

  {% if cur_temp < min_ext %}
    { action_respond_info("ANY[m]: Heating nozzle to 245°C for load (current=%.1f°C, min=%d°C)" % (cur_temp, min_ext)) }
    M109 S245
  {% else %}
    { action_respond_info("ANY[m]: Nozzle already above min_extrude_temp (%.1f°C >= %d°C)" % (cur_temp, min_ext)) }
  {% endif %}

  M83
  G92 E0
  M400
  { action_respond_info("ANY[m]: Extruding 150mm...") }
  G1 E150 F300
  G92 E0
  M400

  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE MOVE=0
  FLUSH_POOP

  {% if ps not in ["printing", "paused"] and prev_target <= 0 %}
    M104 S0
  {% endif %}

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: "Safe pause: E retract, limited Z+10 lift, save/stop fan, Y240 + purge chute park"
variable_nozzle_timeout_seconds: 600
variable_standby_nozzle_temp: 150
variable_retract_length: 2.0
gcode:
  {% set z = params.Z|default(10)|float %}
  {% set cut_filament = params.CUT_FILAMENT|default(0)|int %}
  {% set standby = params.STANDBY|default(0)|int %}
  {% set retract_len = printer["gcode_macro PAUSE"].retract_length|default(2.0)|float %}
  {% set saved_fan_pwm = (((printer.fan.speed|default(0.0)|float) * 255.0)|round|int) if 'fan' in printer else 0 %}
  {% set homed = printer.toolhead.homed_axes|default('')|lower %}
  {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
  {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
  {% set z_target = [cur_z + z, z_limit]|min %}

  {% if printer['pause_resume'].is_paused|int == 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={'%.2f' % z}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_x VALUE={'%.3f' % printer.gcode_move.gcode_position.x}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_y VALUE={'%.3f' % printer.gcode_move.gcode_position.y}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_fan VALUE={saved_fan_pwm}

    {% set current_target = printer.extruder.target|int %}
    {% if printer["gcode_macro _PAUSE_RESUME_STATE"] is defined and current_target > 0 %}
      SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pre_pause_temp VALUE={current_target}
      { action_respond_info("ANY[m]: PAUSE: Saved pre-pause temp: %d°C" % current_target) }
    {% endif %}

    BASE_PAUSE
    M106 S0

    SAVE_GCODE_STATE NAME=PAUSE_LOCAL
    G90
    M82
    {% if 'gcode_macro VEL_PUSH' in printer %}
      VEL_PUSH
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5

    {% if printer.extruder.can_extrude and retract_len > 0 %}
      M83
      G1 E-{'%.2f' % retract_len} F1800
      M82
      M400
    {% endif %}

    {% if 'z' in homed and z_target > cur_z + 0.01 %}
      G90
      G1 Z{'%.3f' % z_target} F1500
      M400
    {% endif %}

    {% if cut_filament == 1 %}
      { action_respond_info("ANY[m]: PAUSE: Cutting filament") }
      CUT_TIP
    {% else %}
      { action_respond_info("ANY[m]: PAUSE: Moving to park/throw position") }
    {% endif %}

    _OK_PAUSE_PARK

    {% if 'gcode_macro VEL_POP' in printer %}
      VEL_POP
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE_LOCAL MOVE=0

    {% if standby == 1 and printer['extruder'].target|int > 0 %}
      {% set target = printer['extruder'].target|int %}
      {% set standby_drop = 20 %}
      {% set standby_temp = (target - standby_drop) if (target - standby_drop) > 0 else 0 %}
      M104 S{standby_temp}
      { action_respond_info("ANY[m]: PAUSE: Immediate standby mode - nozzle at %s°C" % standby_temp) }
    {% else %}
      {% set timeout = printer["gcode_macro PAUSE"].nozzle_timeout_seconds|int %}
      { action_respond_info("ANY[m]: PAUSE: Nozzle will auto-cool to standby after %s seconds" % timeout) }
      {% if 'delayed_gcode pause_nozzle_timeout' in printer.configfile.settings %}
        UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION={timeout}
      {% endif %}
    {% endif %}

    SET_IDLE_TIMEOUT TIMEOUT=43200
    {% if printer["gcode_macro _PAUSE_RESUME_STATE"] is defined %}
      SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pause_nozzle_timeout_triggered VALUE=0
    {% endif %}
  {% endif %}

[gcode_macro _OK_PAUSE_PARK]
description: "Internal helper for PAUSE (reads homed axes after a CUT_TIP that may have homed)"
gcode:
    {% set homed = printer.toolhead.homed_axes|default('')|lower %}
    {% if 'x' in homed and 'y' in homed %}
      G90
      G1 Y240 F9600
      M400
      TO_THROW_POSITION
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: "Safe resume: heat at Z>=15, purge + FLUSH_POOP, restore fan and BASE_RESUME"
variable_zhop: 0
variable_etemp: 0
variable_saved_fan: 0
variable_pause_x: -1000
variable_pause_y: -1000
gcode:
    { action_respond_info("ANY[m] [RESUME] initiated") }
    RESPOND TYPE=command MSG=action:prompt_end
    {% set client_vel = printer.configfile.settings.get('pause_resume', {}).get('recover_velocity', 50.0)|float %}
    {% set std_timeout = printer.configfile.settings.get('idle_timeout', {}).get('timeout', 600.0)|float %}
    {% set purge_amount = params.PURGE|default(40)|float %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set homed = printer.toolhead.homed_axes|default('')|lower %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
      {% if 'delayed_gcode pause_nozzle_timeout' in printer.configfile.settings %}
        UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION=0
      {% endif %}
      SET_IDLE_TIMEOUT TIMEOUT={std_timeout}

      SAVE_GCODE_STATE NAME=RESUME_WRAP

      {% if etemp > 0 %}
        {% if printer["gcode_macro _PAUSE_RESUME_STATE"] is defined
         and printer["gcode_macro _PAUSE_RESUME_STATE"].pause_nozzle_timeout_triggered|int == 1 %}
          { action_respond_info("ANY[m]: RESUME: Reheating nozzle from standby to=%f°C" % etemp) }
        {% endif %}
        MOVE_HEAT_POS
        M109 S{etemp|int}
      {% endif %}

      {% if printer["output_pin ACE_Pro"] is defined and printer["output_pin ACE_Pro"].value
       and printer["gcode_macro _ACE_STATE"] is defined %}
        { action_respond_info("ANY[m]: (Re)activate Tool") }
        {% set active_tool = printer["gcode_macro _ACE_STATE"].active|int %}
        {% if active_tool >= 0 %}
          ACE_CHANGE_TOOL TOOL={active_tool} RAW=1
          M400
        {% else %}
          { action_respond_info("ANY[m]: active_tool=%s" % active_tool) }
        {% endif %}
      {% endif %}

      G92 E0
      { action_respond_info("ANY[m]: Extruder position reset to E=0") }

      {% if purge_amount > 0 and etemp < min_temp %}
        { action_respond_info("ANY[m]: Skipping purge, nozzle target %.0f°C is below %.0f°C" % (etemp, min_temp)) }
      {% elif purge_amount > 0 %}
        TO_THROW_POSITION
        {% set was_abs_e = printer.gcode_move.absolute_extrude %}
        M83
        { action_respond_info("ANY[m]: Purging %fmm filament" % purge_amount) }
        G1 E{'%.2f' % purge_amount} F300
        M400
        {% if was_abs_e %}
          M82
        {% endif %}

        { action_respond_info("ANY[m]: [RESUME] Cool, throw and wipe nozzle") }
        SAVE_GCODE_STATE NAME=RESUME_LOCAL
        {% if 'gcode_macro VEL_PUSH' in printer %}
          VEL_PUSH
        {% endif %}
        SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5
        FLUSH_POOP
        RESUME_NOZZLE_WIPE_SEQUENCE
        M83
        G1 E1 F300
        M400
        {% if 'gcode_macro VEL_POP' in printer %}
          VEL_POP
        {% endif %}
        RESTORE_GCODE_STATE NAME=RESUME_LOCAL MOVE=0
      {% else %}
        { action_respond_info("ANY[m]: Skipping purge and wipe (PURGE=0)") }
      {% endif %}

      M106 S{saved_fan|int}
      G92 E0
      { action_respond_info("ANY[m]: Extruder position reset to E=0 (final)") }
      RESTORE_GCODE_STATE NAME=RESUME_WRAP MOVE=0

      # Go back over the part at the parked height first; BASE_RESUME then only lowers Z
      {% if 'x' in homed and 'y' in homed and pause_x > -999 and pause_y > -999 %}
        SAVE_GCODE_STATE NAME=_ok_resume_xy
        G90
        G1 X{'%.3f' % pause_x} Y{'%.3f' % pause_y} F6000
        M400
        RESTORE_GCODE_STATE NAME=_ok_resume_xy MOVE=0
      {% endif %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_x VALUE=-1000
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_y VALUE=-1000

      {% if printer["output_pin ACE_Pro"] is defined and printer["output_pin ACE_Pro"].value %}
        { action_respond_info("ANY[m]: ACE resume finished") }
      {% endif %}
      BASE_RESUME VELOCITY={params.VELOCITY|default(client_vel)}
    {% else %}
      { action_respond_info("ANY[m] [RESUME] called, but currently not in PAUSED state") }
    {% endif %}

[gcode_macro PRINT_END]
description: "Safe print end: no double cut with ACE, homed check, MOVE_END_POS at the end"
gcode:
    {% set cut_raw = (params.CUT_TIP | default(params.cut_tip) | default("1")) | string %}
    {% set cut_norm = cut_raw | trim | replace('=', '', 1) | lower %}
    {% set do_cut = 1 if cut_norm in ['1', 'true', 'yes', 'on'] else 0 %}
    {% set homed = printer.toolhead.homed_axes|default('')|lower %}
    {% set is_homed_xyz = ('x' in homed) and ('y' in homed) and ('z' in homed) %}
    {% set ace_on = (printer["output_pin ACE_Pro"] is defined) and (printer["output_pin ACE_Pro"].value|int != 0) %}
    {% set can_force = printer.configfile.settings.get('force_move', {}).get('enable_force_move', False) %}
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set z_target = [cur_z + 5.0, z_limit]|min %}

    {% if "gcode_macro clear_last_file" in printer %}
      clear_last_file
    {% endif %}
    {% if 'delayed_gcode pause_nozzle_timeout' in printer.configfile.settings %}
      UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION=0
    {% endif %}

    {% if 'z' in homed and z_target > cur_z + 0.01 %}
      { action_respond_info("PRINT_END, lifting Z safely") }
      G90
      G1 Z{'%.3f' % z_target} F600
      M400
    {% endif %}

    {% if ace_on %}
      _ACE_HANDLE_PRINT_END CUT_TIP={do_cut if is_homed_xyz else 0}
    {% else %}
      {% if do_cut and is_homed_xyz %}
        { action_respond_info("Cutting filament") }
        CUT_TIP
        { action_respond_info("Retracting filament") }
        {% if can_force %}
          FORCE_MOVE STEPPER=extruder DISTANCE=-50 VELOCITY=8
          M400
        {% endif %}
      {% else %}
        { action_respond_info("Skipping CUT_TIP") }
      {% endif %}
    {% endif %}

    {% if 'x' in homed and 'y' in homed %}
      MOVE_END_POS
    {% endif %}

    M104 S0
    M140 S0
    _OK_COOLDOWN_FAN
    M84
    {% if 'gcode_macro lights_off' in printer %}
      lights_off
    {% endif %}

[gcode_macro _OK_COOLDOWN_FAN]
description: "Internal helper: part fan at 80 % for 60 s after a print ends or is cancelled, then off"
variable_speed: 204
variable_seconds: 60
gcode:
    {% set cfg = printer["gcode_macro _OK_COOLDOWN_FAN"] %}
    M106 S{cfg.speed|int}
    UPDATE_DELAYED_GCODE ID=ok_cooldown_fan_off DURATION={cfg.seconds|int}

[delayed_gcode ok_cooldown_fan_off]
gcode:
    M106 S0

[gcode_macro CANCEL_PRINT]
description: "Safe print cancel: bed and fan off first, the cut is done while the nozzle is hot, homed check, no reheating when cold, MOVE_END_POS at the end"
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set homed = printer.toolhead.homed_axes|default('')|lower %}
    {% set is_homed_xyz = ('x' in homed) and ('y' in homed) and ('z' in homed) %}
    {% set ace_on = (printer["output_pin ACE_Pro"] is defined) and (printer["output_pin ACE_Pro"].value|int != 0) %}
    {% set can_force = printer.configfile.settings.get('force_move', {}).get('enable_force_move', False) %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set cur_temp = printer.extruder.temperature|default(0.0)|float %}
    {% set is_hot_for_ace = cur_temp >= (min_temp + 15.0) %}
    {% set is_hot = printer.extruder.can_extrude %}
    {% set cur_z = printer.gcode_move.gcode_position.z|default(0.0)|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z|default(262.0)|float - printer.gcode_move.homing_origin.z|default(0.0)|float %}
    {% set z_target = [cur_z + 10.0, z_limit]|min %}
    {% set std_timeout = printer.configfile.settings.get('idle_timeout', {}).get('timeout', 600.0)|float %}
    # The nozzle must stay hot while the tip is cut and the filament pulled back;
    # it is switched off first only when no hot cut will happen.
    {% set will_cut = is_homed_xyz and ((ace_on and is_hot_for_ace) or ((not ace_on) and is_hot)) %}

    RESPOND TYPE=command MSG=action:prompt_end
    {% if 'delayed_gcode pause_nozzle_timeout' in printer.configfile.settings %}
      UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION=0
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={std_timeout}
    {% if "gcode_macro clear_last_file" in printer %}
      clear_last_file
    {% endif %}

    {% if not will_cut %}
      M104 S0
    {% endif %}
    M140 S0
    M106 S0

    {% if 'z' in homed and z_target > cur_z + 0.01 %}
      { action_respond_info("ACE[M]: CANCEL_PRINT, lifting Z safely") }
      G90
      G1 Z{'%.3f' % z_target} F600
      M400
    {% endif %}

    {% if ace_on %}
      {% if will_cut %}
        _ACE_HANDLE_PRINT_END CUT_TIP=1
      {% else %}
        _ACE_HANDLE_PRINT_END CUT_TIP=0
      {% endif %}
    {% else %}
      {% if will_cut %}
        { action_respond_info("ACE[M]: ACE Pro disabled. Normal cut sequence") }
        CUT_TIP
        {% if can_force %}
          FORCE_MOVE STEPPER=extruder DISTANCE=-50 VELOCITY=8
          M400
        {% endif %}
      {% endif %}
    {% endif %}

    M104 S0
    M140 S0
    _OK_COOLDOWN_FAN

    {% if 'x' in homed and 'y' in homed %}
      MOVE_END_POS
    {% endif %}

    M84
    {% if 'gcode_macro lights_off' in printer %}
      lights_off
    {% endif %}
    CANCEL_PRINT_BASE
